[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-workflow"
version = "0.1.0"
description = "Declarative DAG workflows with WAIT/RESUME, priority scheduling, and distributed rehydration"
authors = [{ name = "Shawn Knight" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
persistence = ["sqlalchemy>=2.0.0"]
dev         = ["pytest>=8.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-workflow"
Repository = "https://github.com/Masterplanner25/nodus-workflow"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_workflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
