[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-workflow"
version = "0.1.0"
description = "Declarative DAG workflows with WAIT/RESUME, priority scheduling, and distributed rehydration"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Masterplanner25" }]
dependencies = ["nodus-events>=0.1.0", "nodus-queue>=0.1.0", "nodus-retry>=0.1.0", "nodus-state>=0.1.0"]

[project.optional-dependencies]
persistence = ["sqlalchemy>=2.0.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_workflow*"]