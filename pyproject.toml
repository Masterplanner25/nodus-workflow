[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-flow"
version = "0.2.0"
description = "Standalone asyncio DAG runner with WAIT/RESUME and rehydration. Not the engine behind the Nodus `workflow` keyword."
authors = [{ name = "Shawn Knight" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
persistence = ["sqlalchemy>=2.0.0"]
dev         = ["pytest>=8.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-flow"
Repository = "https://github.com/Masterplanner25/nodus-flow"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_flow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
